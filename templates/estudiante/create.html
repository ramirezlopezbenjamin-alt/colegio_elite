{% extends 'layout.html'%}
{% block contenido %} 
<h2>Agregar Estudiante</h2>
<form action="{{ url_for('estudiante.create') }}" method="POST">
    <label>Nombre:</label>
    <input class="form-control" type="text" name="nombre" required><br>
    
    <label>Apellido:</label>
    <input class="form-control" type="text" name="apellido" required><br>
    
    <label>Email:</label>
    <input class="form-control" type="email" name="email" required><br>
    
    <button type="submit">Guardar</button>
</form>
<a href="{{ url_for('estudiante.index') }}">Volver</a>

{% endblock %}
