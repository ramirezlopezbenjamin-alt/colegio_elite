{% extends 'layout.html' %}

{% block title %}Editar Estudiante{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Editar Estudiante</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('estudiante.editar', id=estudiante.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" name="nombre" value="{{ estudiante.nombre }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido:</label>
                        <input type="text" name="apellido" value="{{ estudiante.apellido }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico:</label>
                        <input type="email" name="email" value="{{ estudiante.email }}" class="form-control" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('estudiante.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-warning">Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
